name: Deploy console to GitHub Pages

# Publishes ui/finbuddy_console.html as a real, unsandboxed web page --
# unlike a claude.ai Artifact preview, GitHub Pages has no CSP restriction
# blocking fetch() to the live HF Space, so the credit-assessment and chat
# flows actually work end to end here.
on:
  push:
    branches: [master]
    paths: ["ui/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui
      - id: deployment
        uses: actions/deploy-pages@v4
