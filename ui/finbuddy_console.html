<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask FinBuddy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  }
  @media (prefers-color-scheme: dark) {
    body:not([data-theme="light"]) { background: radial-gradient(circle at 50% -10%, #1e2547 0%, #0b1220 45%, #060a14 100%); }
  }
  body[data-theme="dark"] { background: radial-gradient(circle at 50% -10%, #1e2547 0%, #0b1220 45%, #060a14 100%); }
  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  [hidden] { display: none !important; }
  .glow-blue { box-shadow: 0 10px 28px -6px rgba(37, 99, 235, 0.38); }
  .card-shadow { box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 20px -6px rgba(15,23,42,0.06); }

<div class="min-h-screen flex items-start sm:items-center justify-center p-2 sm:p-4 text-slate-800 dark:text-slate-100">
<div class="w-full max-w-md bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl rounded-[28px] card-shadow shadow-2xl overflow-hidden border border-white/60 dark:border-slate-700/60 flex flex-col">

  <!-- Header (always visible) -->

    <div class="flex justify-between items-center mb-4">
      <div class="flex items-center gap-2">

        <div>
          <h1 class="text-lg font-extrabold tracking-tight leading-none" id="brandName">FinBuddy</h1>
          <p class="text-[10px] text-slate-400 dark:text-slate-500 font-semibold tracking-wide uppercase mt-0.5" id="brandTagline"></p>
        </div>
      </div>
      <div id="statusPill" class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 rounded-full px-2.5 py-1.5 transition-colors">
        <span id="statusDot" class="w-1.5 h-1.5 rounded-full bg-slate-300 animate-pulse motion-reduce:animate-none"></span>
        <span id="statusText" class="text-[10px] font-bold text-slate-500 dark:text-slate-400"></span>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-2 mb-4 text-xs font-bold" id="langSwitch" role="group" aria-label="Language">
      <button data-lang="en" class="lang-btn py-2 rounded-xl border transition-all">English</button>
      <button data-lang="hi" class="lang-btn py-2 rounded-xl border transition-all">हिन्दी</button>
      <button data-lang="kn" disabled title="Coming soon" class="py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-300 dark:text-slate-600 cursor-not-allowed">ಕನ್ನಡ<span class="text-[8px] align-super">SOON</span></button>
    </div>
  </div>

  <!-- VIEW: credit-assessment input -->
  <div id="view-input" class="px-5 pb-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-[11px] font-extrabold text-slate-400 dark:text-slate-500 tracking-wider uppercase" id="creditHeading"></h2>
      <span class="text-[9px] font-bold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/40 px-2 py-0.5 rounded-md" id="personaCount"></span>
    </div>
    <p class="text-xs text-slate-500 dark:text-slate-400 mb-4 leading-relaxed" id="creditHint"></p>

    <div class="grid grid-cols-3 gap-2.5 mb-4" id="personaRow"></div>

    <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-2xl mb-4 text-xs font-bold">
      <button id="tabSimple" class="mode-tab flex-1 py-2 rounded-xl transition-all duration-200"></button>
      <button id="tabAdvanced" class="mode-tab flex-1 py-2 rounded-xl transition-all duration-200"></button>
    </div>

    <div id="simpleCard" class="bg-gradient-to-b from-slate-50 to-white dark:from-slate-800/60 dark:to-slate-800/30 rounded-2xl p-4 border border-slate-200/70 dark:border-slate-700 card-shadow mb-4"></div>
    <div id="fieldGrid" class="hidden bg-slate-900 dark:bg-black text-white rounded-2xl p-4 border border-slate-800 shadow-lg mb-4 text-xs space-y-3"></div>

    <button id="scoreBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-extrabold py-4 rounded-2xl glow-blue transition-all text-sm tracking-wide flex items-center justify-center gap-2"></button>
    <div id="creditError" hidden class="mt-2 bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 rounded-xl p-3 text-xs"></div>
    <p class="text-center text-[10px] text-slate-400 dark:text-slate-500 font-medium mt-2.5" id="creditFooter"></p>
  </div>

  <!-- VIEW: credit-assessment result -->
  <div id="view-result" hidden class="px-5 pb-5 custom-scrollbar overflow-y-auto max-h-[70vh]">
    <div class="flex justify-between items-center mb-4 pb-2.5 pt-1 border-b border-slate-100 dark:border-slate-800">
      <button id="backBtn" class="text-blue-600 dark:text-blue-400 text-xs font-extrabold flex items-center gap-1.5">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span id="backLabel"></span>
      </button>
      <h2 class="text-[11px] font-extrabold tracking-wider uppercase text-slate-400 dark:text-slate-500" id="resultTitle"></h2>

    </div>

    <div class="flex justify-center mb-4">
      <span id="verdictBadge" class="text-xs font-black tracking-widest px-5 py-2 rounded-full uppercase shadow-sm flex items-center gap-2 border"></span>
    </div>

    <div class="bg-gradient-to-br from-white to-slate-50/80 dark:from-slate-800 dark:to-slate-800/60 rounded-2xl p-4 border border-slate-200/70 dark:border-slate-700 card-shadow mb-4">
      <div class="flex justify-between items-start">
        <div>
          <span class="text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-wider block" id="primarySignalLabel"></span>
          <span id="primarySignalValue" class="text-xs font-bold text-slate-800 dark:text-slate-100 mt-0.5 block"></span>
          <span id="fairnessTag" class="inline-flex items-center gap-1 mt-2 bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-400 text-[10px] font-bold px-2 py-0.5 rounded-md border border-blue-200 dark:border-blue-900"></span>
        </div>
        <div class="text-right">
          <span class="text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-wider block" id="scoreLabel"></span>
          <span id="scoreValue" class="text-2xl font-black text-blue-600 dark:text-blue-400 mt-0.5 block"></span>
          <span class="block text-[10px] text-slate-400 dark:text-slate-500 font-semibold" id="repayLine"></span>
        </div>
      </div>
      <div id="anomalyRow" hidden class="mt-3 bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-400 text-[11px] font-semibold px-2.5 py-1.5 rounded-lg border border-amber-200 dark:border-amber-900"></div>
    </div>

    <div class="bg-gradient-to-r from-blue-50 to-indigo-50 dark:from-blue-950/30 dark:to-indigo-950/20 border-l-4 border-blue-600 p-3.5 rounded-r-2xl mb-5">

        <span class="text-[10px] font-extrabold text-blue-600 dark:text-blue-400 uppercase tracking-wider" id="insightLabel"></span>
      </div>
      <p id="quoteText" class="text-xs font-bold text-slate-900 dark:text-slate-100 italic leading-relaxed"></p>
    </div>

    <h3 class="text-[11px] font-extrabold text-slate-400 dark:text-slate-500 tracking-wider uppercase mb-2.5" id="factorsHeading"></h3>
    <div class="space-y-3 mb-5" id="factorsList"></div>

    <p class="text-[11px] text-slate-400 dark:text-slate-500 italic leading-relaxed mb-4" id="disclaimerText"></p>

    <div class="flex flex-wrap gap-2 mb-4" id="metaRow"></div>
  </div>

    <h2 class="text-[11px] font-extrabold text-slate-400 dark:text-slate-500 tracking-wider uppercase mb-2 mt-4" id="chatHeading"></h2>
    <p class="text-xs text-slate-500 dark:text-slate-400 mb-3 leading-relaxed" id="chatHint"></p>
    <div class="flex flex-col gap-3 mb-3 max-h-72 overflow-y-auto custom-scrollbar" id="thread"></div>
    <p id="hintText" hidden class="text-[11px] text-slate-400 dark:text-slate-500 mb-2"></p>
    <div class="flex flex-wrap gap-2 mb-3" id="chips"></div>
    <div class="flex gap-2 items-end">
      <textarea id="input" rows="1" class="flex-1 resize-none border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-2xl px-3.5 py-2.5 text-sm max-h-28 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400"></textarea>

    </div>
  </div>

</div>
</div>

  const scoreBtn = el('scoreBtn'), creditError = el('creditError'), creditFooter = el('creditFooter');
  const viewInput = el('view-input'), viewResult = el('view-result'), backBtn = el('backBtn'), backLabel = el('backLabel');
  const resultTitle = el('resultTitle'), liveBadge = el('liveBadge'), verdictBadge = el('verdictBadge');
  const primarySignalLabel = el('primarySignalLabel'), primarySignalValue = el('primarySignalValue'), fairnessTag = el('fairnessTag');
  const scoreLabel = el('scoreLabel'), scoreValue = el('scoreValue'), repayLine = el('repayLine'), anomalyRow = el('anomalyRow');
  const insightLabel = el('insightLabel'), quoteText = el('quoteText'), factorsHeading = el('factorsHeading'), factorsList = el('factorsList');
  const disclaimerText = el('disclaimerText'), metaRow = el('metaRow');
  const chatHeading = el('chatHeading'), chatHint = el('chatHint'), thread = el('thread'), hintText = el('hintText');
  const chipsEl = el('chips'), input = el('input'), sendBtn = el('sendBtn');

  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

  const ACTIVE_LANG = 'py-2 rounded-xl border transition-all border-blue-600 bg-blue-600 text-white shadow-sm shadow-blue-500/30';
  const INACTIVE_LANG = 'py-2 rounded-xl border transition-all border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:border-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800';
  const ACTIVE_TAB = 'mode-tab flex-1 py-2 rounded-xl transition-all duration-200 bg-white dark:bg-slate-700 shadow-sm text-blue-600 dark:text-blue-400';
  const INACTIVE_TAB = 'mode-tab flex-1 py-2 rounded-xl transition-all duration-200 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200';

  function applyStrings() {
    const s = S();
    brandTagline.textContent = s.tagline;
    statusText.textContent = isLive ? s.statusLive : (statusDot.dataset.bad ? s.statusDown : s.statusChecking);
    langSwitch.querySelectorAll('.lang-btn').forEach((b) => {
      b.className = 'lang-btn ' + (b.dataset.lang === currentLang ? ACTIVE_LANG : INACTIVE_LANG);
    });
    creditHeading.textContent = s.creditHeading;
    personaCount.textContent = s.personaCount;
    creditHint.textContent = s.creditHint;
    tabSimple.textContent = s.tabSimple;
    tabAdvanced.textContent = s.tabAdvanced;
    tabSimple.className = mode === 'simple' ? ACTIVE_TAB : INACTIVE_TAB;
    tabAdvanced.className = mode === 'advanced' ? ACTIVE_TAB : INACTIVE_TAB;
    scoreBtn.innerHTML = (scoreBtn.dataset.loading ? s.scoreBtnLoading : s.scoreBtn) + (scoreBtn.dataset.loading ? '' : ' <span aria-hidden="true">&rarr;</span>');
    creditFooter.textContent = s.creditFooter;
    backLabel.textContent = s.backLabel;
    resultTitle.textContent = s.resultTitle;
    liveBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-white/90 animate-pulse motion-reduce:animate-none"></span> ${escapeHtml(s.liveBadge)}`;
    primarySignalLabel.textContent = s.primarySignalLabel;
    scoreLabel.textContent = s.scoreLabel;
    insightLabel.textContent = s.insightLabel;
    factorsHeading.textContent = s.factorsHeading;
    chatHeading.textContent = s.chatHeading;
    chatHint.textContent = s.chatHint;
    input.placeholder = s.placeholder;
    sendBtn.textContent = s.send;
    if (currentLang === 'en') { hintText.hidden = true; } else { hintText.hidden = false; hintText.textContent = s.hintOtherLang; }
    chipsEl.innerHTML = s.chips.map((c, i) => `<button class="chip bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium px-3 py-2 rounded-full hover:border-blue-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" data-idx="${i}">${escapeHtml(c.label)}</button>`).join('');
    renderPersonaRow();
    renderSimpleCard();
    renderFieldGrid();
  }

  function renderPersonaRow() {
    const s = S();
    personaRow.innerHTML = Object.keys(PERSONAS).map((key) => {
      const p = PERSONAS[key], label = s.personas[key];
      const active = key === selectedPersona;
      const base = 'persona-card p-3 rounded-2xl border-2 flex flex-col items-center text-center transition-all duration-200 group';
      const cls = active
        ? base + ' border-blue-600 bg-gradient-to-br from-blue-50 to-white dark:from-blue-950/40 dark:to-slate-800 shadow-md shadow-blue-500/10'
        : base + ' border-slate-100 dark:border-slate-700 bg-slate-50/60 dark:bg-slate-800/40 hover:border-slate-300';
      return `<button class="${cls}" data-persona="${key}" type="button">
        <div class="w-10 h-10 mb-1.5 rounded-2xl ${ICON_BG[p.color]} flex items-center justify-center text-xl group-hover:scale-110 transition-transform">${p.emoji}</div>
        <span class="text-xs font-bold text-slate-800 dark:text-slate-100 leading-tight">${escapeHtml(label.name)}</span>
        <span class="text-[9px] text-slate-500 dark:text-slate-400 font-medium leading-tight mt-0.5">${escapeHtml(label.sub)}</span>
      </button>`;
    }).join('');
  }

  function renderSimpleCard() {
    const s = S();
    const p = PERSONAS[selectedPersona], label = s.personas[selectedPersona];
    const stat = (l, v, color) => `<div class="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700"><span class="text-slate-400 dark:text-slate-500 block text-[9px] font-bold uppercase tracking-wide">${l}</span><span class="font-extrabold ${color} text-sm block mt-0.5">${v}</span></div>`;
    simpleCard.innerHTML = `
      <div class="flex items-center gap-3 mb-3.5 pb-3 border-b border-slate-100 dark:border-slate-700">
        <div class="w-10 h-10 rounded-xl ${ICON_BG[p.color]} flex items-center justify-center text-xl">${p.emoji}</div>
        <div><h3 class="font-extrabold text-slate-900 dark:text-slate-100 text-sm">${escapeHtml(label.name)}</h3><p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">${escapeHtml(label.sub)}</p></div>
      </div>
      <div class="grid grid-cols-2 gap-2.5">
        ${stat(s.simpleLabels.income, '₹' + formValues.avg_monthly_income.toLocaleString(), 'text-emerald-600 dark:text-emerald-400')}
        ${stat(s.simpleLabels.upi, formValues.tx_count_30d, 'text-slate-700 dark:text-slate-200')}
        ${stat(s.simpleLabels.tenure, formValues.tenure_months, 'text-slate-700 dark:text-slate-200')}
        ${stat(s.simpleLabels.geo, s.geographyOptions[formValues.geography], 'text-slate-700 dark:text-slate-200')}
      </div>`;
  }

  function renderFieldGrid() {
    const s = S();
    const rows = FIELD_ORDER.map((key) => `
      <div><label class="block text-slate-400 dark:text-slate-500 text-[9px] font-bold uppercase tracking-wide mb-1">${escapeHtml(s.fields[key])}</label>
      <input type="number" data-field="${key}" value="${formValues[key]}" step="${NUM_STEP[key] || '1'}" min="0" class="w-full bg-slate-800 dark:bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-xs font-semibold focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"></div>
    `).join('');
    const geoOptions = Object.keys(s.geographyOptions).map((k) => `<option value="${k}" ${formValues.geography === k ? 'selected' : ''}>${escapeHtml(s.geographyOptions[k])}</option>`).join('');
    fieldGrid.innerHTML = `<div class="grid grid-cols-2 gap-3">${rows}</div>
      <div><label class="block text-slate-400 dark:text-slate-500 text-[9px] font-bold uppercase tracking-wide mb-1">${escapeHtml(s.fields.geography)}</label>
      <select data-field="geography" class="w-full bg-slate-800 dark:bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-xs font-semibold focus:outline-none focus:border-blue-500">${geoOptions}</select></div>`;
  }

  function setMode(m) {
    mode = m;
    simpleCard.classList.toggle('hidden', m !== 'simple');
    fieldGrid.classList.toggle('hidden', m !== 'advanced');
    applyStrings();
  }
  tabSimple.addEventListener('click', () => setMode('simple'));
  tabAdvanced.addEventListener('click', () => setMode('advanced'));

  personaRow.addEventListener('click', (e) => {
    const btn = e.target.closest('.persona-card');
    if (!btn) return;
    selectedPersona = btn.dataset.persona;
    formValues = { ...PERSONAS[selectedPersona] };
    if (selectedPersona === 'custom') setMode('advanced'); else applyStrings();
  });

  fieldGrid.addEventListener('input', (e) => {
    const target = e.target.closest('[data-field]');
    if (!target) return;
    formValues[target.dataset.field] = target.tagName === 'SELECT' ? target.value : Number(target.value);
    if (mode === 'simple') renderSimpleCard();
  });

  langSwitch.addEventListener('click', (e) => {
    const btn = e.target.closest('.lang-btn');
    if (!btn || btn.disabled) return;
    currentLang = btn.dataset.lang;
    applyStrings();
    renderGreeting();
  });

  function showResultView() { viewInput.hidden = true; viewResult.hidden = false; }
  function showInputView() { viewResult.hidden = true; viewInput.hidden = false; }
  backBtn.addEventListener('click', showInputView);

  function factorDisplayName(factor) {
    // Reuses the same localized field labels the credit form already shows
    // (not a separate always-English map) -- strips the unit suffix like
    // "(₹)" or "(0–1)" since that reads oddly as a factor-row title.
    const label = S().fields[factor] || factor;
    return label.replace(/\s*\([^)]*\)\s*$/, '');
  }

  function renderResult(data) {
    const s = S();
    const c = data.credit_assessment;
    if (!c) return;

    verdictBadge.innerHTML = (c.approved ? '✓ ' : '✕ ') + escapeHtml(c.approved ? s.approved : s.notApproved);
    verdictBadge.className = 'text-xs font-black tracking-widest px-5 py-2 rounded-full uppercase shadow-sm flex items-center gap-2 border ' +
      (c.approved
        ? 'bg-gradient-to-r from-emerald-50 to-teal-50 dark:from-emerald-950/50 dark:to-teal-950/40 text-emerald-800 dark:text-emerald-400 border-emerald-300 dark:border-emerald-800'
        : 'bg-gradient-to-r from-rose-50 to-orange-50 dark:from-rose-950/50 dark:to-orange-950/40 text-rose-800 dark:text-rose-400 border-rose-300 dark:border-rose-800');

    const primary = c.top_3_factors[0];
    primarySignalValue.textContent = primary ? factorDisplayName(primary.factor) : '—';
    fairnessTag.textContent = c.fairness_mitigation_applied ? s.metaFair : s.metaPlain;
    scoreValue.textContent = c.credit_score;
    repayLine.textContent = s.repayLine(Math.round(c.calibrated_probability_of_repayment * 100));

    if (c.is_anomalous) { anomalyRow.hidden = false; anomalyRow.textContent = s.anomalyLine(c.anomaly_note); }
    else { anomalyRow.hidden = true; }

    const label = s.personas[selectedPersona];
    const prefix = label.addressName ? label.addressName + ' — ' : '';
    quoteText.textContent = prefix + data.answer;

    factorsList.innerHTML = c.top_3_factors.map((f) => {
      const pos = f.direction === 'positive';
      const pct = Math.min(100, Math.abs(f.shap_contribution) * 40);
      const barGrad = pos ? 'from-emerald-400 to-emerald-500' : 'from-rose-400 to-rose-500';
      return `<div class="bg-white dark:bg-slate-800 rounded-2xl p-3.5 border border-slate-100 dark:border-slate-700 card-shadow">
        <div class="flex justify-between items-center mb-1.5 text-xs">
          <span class="font-bold text-slate-800 dark:text-slate-100">${escapeHtml(factorDisplayName(f.factor))}</span>
          <span class="font-extrabold ${pos ? 'text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40' : 'text-rose-500 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40'} px-2 py-0.5 rounded-md text-[11px]">${pos ? '+' : ''}${f.shap_contribution.toFixed(2)}</span>
        </div>
        <div class="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden mb-2"><div class="bg-gradient-to-r ${barGrad} h-full rounded-full transition-all duration-500" style="width:${pct}%"></div></div>
        <p class="text-[11px] text-slate-500 dark:text-slate-400 mb-1.5 font-medium">${escapeHtml(f.plain_english)}</p>
        <div class="flex items-center gap-1.5 text-[11px] ${pos ? 'text-blue-600 dark:text-blue-400' : 'text-amber-600 dark:text-amber-400'} font-bold"><span aria-hidden="true">&#9889;</span> ${escapeHtml(f.action)}</div>
      </div>`;
    }).join('');

    disclaimerText.textContent = data.disclaimer || '';
    const chip = (t) => `<span class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 px-2.5 py-1 rounded-full">${escapeHtml(t)}</span>`;
    metaRow.innerHTML = chip(s.metaLatency(Math.round(c.latency_ms))) + chip(c.fairness_mitigation_applied ? s.metaFair : s.metaPlain) + chip(s.metaBand(c.income_band));

    showResultView();
  }

  async function runCreditAssessment() {
    creditError.hidden = true;
    scoreBtn.disabled = true;
    scoreBtn.dataset.loading = '1';
    scoreBtn.textContent = S().scoreBtnLoading;
    try {
      const res = await fetch(API_BASE + '/agent/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: 'Can I get a loan?', session_id: sessionId, response_language: currentLang, credit_signals: { ...formValues } }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.credit_assessment) throw new Error(data.answer || 'no assessment returned');
      renderResult(data);
    } catch (e) {
      creditError.textContent = S().creditErr(e.message);
      creditError.hidden = false;
    } finally {
      scoreBtn.disabled = false;
      delete scoreBtn.dataset.loading;
      applyStrings();
    }
  }
  scoreBtn.addEventListener('click', runCreditAssessment);

  async function checkHealth() {
    try {
      const r = await fetch(API_BASE + '/health', { method: 'GET' });
      isLive = r.ok;
      statusDot.className = 'w-1.5 h-1.5 rounded-full animate-pulse motion-reduce:animate-none ' + (r.ok ? 'bg-emerald-500' : 'bg-rose-500');
      if (!r.ok) statusDot.dataset.bad = '1';
    } catch (e) {
      isLive = false;
      statusDot.className = 'w-1.5 h-1.5 rounded-full animate-pulse motion-reduce:animate-none bg-rose-500';
      statusDot.dataset.bad = '1';
    }
    applyStrings();
  }

  function addUserTurn(text) {
    const wrap = document.createElement('div');
    wrap.className = 'flex justify-end';
    wrap.innerHTML = `<div class="max-w-[85%] bg-blue-600 text-white text-sm rounded-2xl rounded-br-md px-3.5 py-2.5 shadow-sm shadow-blue-500/20">${escapeHtml(text)}</div>`;
    thread.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
  }

  function addThinkingTurn() {
    const wrap = document.createElement('div');
    wrap.className = 'flex justify-start';
    wrap.innerHTML = `<div class="bg-slate-100 dark:bg-slate-800 rounded-2xl rounded-bl-md px-4 py-3 flex gap-1"><span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounce motion-reduce:animate-none"></span><span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounce motion-reduce:animate-none [animation-delay:150ms]"></span><span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounce motion-reduce:animate-none [animation-delay:300ms]"></span></div>`;
    thread.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
    return wrap;
  }

  let traceSeq = 0;
  function routeLabel(route) { const s = S(); return (route && s.routeLabels[route]) || '—'; }

  function buildTraceCard(data) {
    const s = S();
    const hasScore = typeof data.top_score === 'number';
    let rows = `<div class="flex items-center gap-2 mb-1.5"><span class="text-[9px] uppercase tracking-wide text-slate-400 dark:text-slate-500 font-bold w-16 flex-shrink-0">${s.traceRoute}</span><span class="text-[11px] font-mono px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200">${routeLabel(data.route)}</span></div>`;
    if (hasScore) {
      const pct = Math.max(0, Math.min(1, data.top_score)) * 100;
      rows += `<div class="flex items-center gap-2 mb-1.5"><span class="text-[9px] uppercase tracking-wide text-slate-400 dark:text-slate-500 font-bold w-16 flex-shrink-0">${s.traceGrounding}</span><div class="flex-1 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden"><div class="h-full ${data.sufficient ? 'bg-emerald-500' : 'bg-amber-500'} rounded-full" style="width:${pct}%"></div></div><span class="text-[10px] font-mono text-slate-500">${data.sufficient ? s.groundedYes : s.groundedNo}</span></div>`;
    }
    if (data.sources && data.sources.length) {
      rows += `<div class="flex items-start gap-2 mb-1.5"><span class="text-[9px] uppercase tracking-wide text-slate-400 dark:text-slate-500 font-bold w-16 flex-shrink-0">${s.traceSources}</span><span class="text-[10px] font-mono text-slate-500">${data.sources.map(escapeHtml).join(', ')}</span></div>`;
    }
    rows += `<div class="flex items-center gap-2"><span class="text-[9px] uppercase tracking-wide text-slate-400 dark:text-slate-500 font-bold w-16 flex-shrink-0">${s.traceStatus}</span><span class="text-[11px] font-mono ${data.escalate_to_human ? 'text-amber-600' : 'text-emerald-600'}">${data.escalate_to_human ? s.resultEscalated : s.resultAnswered}</span></div>`;
    return rows;
  }

  function addAssistantTurn(data) {
    const wrap = document.createElement('div');
    wrap.className = 'flex flex-col items-start gap-1';
    const cites = (data.sources || []).map((x) => `<span class="text-[9px] font-mono bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-600">${escapeHtml(x)}</span>`).join('');
    const disclaimer = data.disclaimer ? `<div class="text-[11px] italic text-slate-400 mt-1.5">${escapeHtml(data.disclaimer)}</div>` : '';
    const traceId = 'trace-' + (traceSeq++);
    wrap.innerHTML = `
      <div class="max-w-[90%] ${data.escalate_to_human ? 'bg-amber-50 dark:bg-amber-950/30 border-amber-200 dark:border-amber-900' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700'} border text-sm text-slate-800 dark:text-slate-100 rounded-2xl rounded-bl-md px-3.5 py-2.5 card-shadow">
        ${escapeHtml(data.answer)}
        ${cites ? `<div class="flex flex-wrap gap-1.5 mt-2 pt-2 border-t border-dashed border-slate-200 dark:border-slate-600">${cites}</div>` : ''}
        ${disclaimer}
      </div>
      <button class="trace-toggle text-[11px] text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 underline decoration-dotted" data-target="${traceId}" type="button">${S().traceShow}</button>
      <div class="trace-card hidden bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-3 w-full" id="${traceId}">${buildTraceCard(data)}</div>
    `;
    thread.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
  }

  function addErrorTurn(message) {
    const wrap = document.createElement('div');
    wrap.className = 'flex justify-start';
    wrap.innerHTML = `<div class="max-w-[85%] bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900 text-sm text-slate-800 dark:text-slate-100 rounded-2xl rounded-bl-md px-3.5 py-2.5">${escapeHtml(message)}</div>`;
    thread.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
  }

  thread.addEventListener('click', (e) => {
    const btn = e.target.closest('.trace-toggle');
    if (!btn) return;
    const card = document.getElementById(btn.dataset.target);
    const isOpen = card.classList.toggle('hidden') === false;
    btn.textContent = isOpen ? S().traceHide : S().traceShow;
  });

  function renderGreeting() {
    thread.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'flex justify-start';
    wrap.innerHTML = `<div class="max-w-[90%] bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 rounded-2xl rounded-bl-md px-3.5 py-2.5 card-shadow">${escapeHtml(S().greeting)}</div>`;
    thread.appendChild(wrap);
  }

  async function sendMessage(queryText, displayText) {
    if (!queryText.trim()) return;
    input.value = ''; input.style.height = 'auto';
    sendBtn.disabled = true;
    addUserTurn(displayText || queryText);
    const thinkingEl = addThinkingTurn();
    try {
      const res = await fetch(API_BASE + '/agent/run', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: queryText, session_id: sessionId, response_language: currentLang }),
      });
      thinkingEl.remove();
      if (!res.ok) { addErrorTurn(S().errHttp(res.status)); return; }
      const data = await res.json();
      addAssistantTurn(data);
      isLive = true; statusDot.className = 'w-1.5 h-1.5 rounded-full animate-pulse motion-reduce:animate-none bg-emerald-500'; delete statusDot.dataset.bad;
      statusText.textContent = S().statusLive;
    } catch (e) {
      thinkingEl.remove();
      addErrorTurn(S().errNetwork);
      isLive = false; statusDot.className = 'w-1.5 h-1.5 rounded-full animate-pulse motion-reduce:animate-none bg-rose-500'; statusDot.dataset.bad = '1';
      statusText.textContent = S().statusDown;
    } finally {
      sendBtn.disabled = false; input.focus();
    }
  }
  sendBtn.addEventListener('click', () => sendMessage(input.value));
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(input.value); } });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 112) + 'px'; });
  chipsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    const chip = S().chips[Number(btn.dataset.idx)];
    sendMessage(chip.query, chip.label);
  });

  setMode('simple');
  applyStrings();
  renderGreeting();
  checkHealth();
</script>
