<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask FinBuddy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;500;600&display=swap');

  :root {
    --bg: #FBFAF7;
    --surface: #FFFFFF;
    --surface-sunken: #F3F1EA;
    --ink: #15202E;
    --ink-soft: #3C4A5E;
    --slate: #5A6B85;
    --line: #E3E1D9;
    --navy: #0F1F3D;
    --navy-ink: #FFFFFF;
    --gold: #9C7A21;
    --gold-soft: #F4ECD8;
    --green: #2E7D4F;
    --green-soft: #E4F1E9;
    --amber: #A8681E;
    --amber-soft: #FBEEDD;
    --red: #A3402B;
    --red-soft: #FBE9E4;
    --focus: #2E5AAC;
    --shadow: 0 1px 2px rgba(21,32,46,0.06), 0 6px 20px rgba(21,32,46,0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1420; --surface: #121F33; --surface-sunken: #0E1826;
      --ink: #E8ECF3; --ink-soft: #C3CEDF; --slate: #92A2BC; --line: #22314C;
      --navy: #1B3768; --navy-ink: #EAF0FA; --gold: #D9B764; --gold-soft: #26210F;
      --green: #6FCB94; --green-soft: #12261B; --amber: #E0A860; --amber-soft: #2A2011;
      --red: #E28A76; --red-soft: #2A1815; --focus: #7FA6E8;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1420; --surface: #121F33; --surface-sunken: #0E1826;
    --ink: #E8ECF3; --ink-soft: #C3CEDF; --slate: #92A2BC; --line: #22314C;
    --navy: #1B3768; --navy-ink: #EAF0FA; --gold: #D9B764; --gold-soft: #26210F;
    --green: #6FCB94; --green-soft: #12261B; --amber: #E0A860; --amber-soft: #2A2011;
    --red: #E28A76; --red-soft: #2A1815; --focus: #7FA6E8;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', 'Noto Sans Devanagari', 'Noto Sans Kannada', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-width: 640px;
    margin: 0 auto;
    background: var(--bg);
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    gap: 10px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }

  /* ---------- Section cards (credit assessment + result) ---------- */
  main { padding: 16px 16px 4px; display: flex; flex-direction: column; gap: 16px; }
  .section-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 16px;
    box-shadow: var(--shadow);
  }
  .section-card h2 {
    font-family: 'Source Serif 4', serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .section-hint {
    font-size: 12.5px;
    color: var(--slate);
    margin: 0 0 14px;
    line-height: 1.5;
  }

  .persona-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .persona-card {
    background: var(--surface-sunken);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
  }
  .persona-card.active { border-color: var(--navy); background: var(--gold-soft); }
  .persona-card .emoji { font-size: 20px; display: block; margin-bottom: 4px; }
  .persona-card .p-name { font-size: 12.5px; font-weight: 600; display: block; }
  .persona-card .p-sub { font-size: 10.5px; color: var(--slate); display: block; margin-top: 1px; }

  .fields-toggle {
    background: none; border: none; color: var(--focus);
    font-family: inherit; font-size: 12.5px; padding: 0;
    cursor: pointer; text-decoration: underline; text-decoration-style: dotted;
    margin-bottom: 12px;
  }
  .field-grid {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .field-grid.open { display: grid; }
  .field-grid .field-full { grid-column: 1 / -1; }
  .field-grid label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--slate); font-weight: 600; display: block; margin-bottom: 4px;
  }
  .field-grid input, .field-grid select {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface-sunken);
    color: var(--ink); font-family: inherit; font-size: 13.5px;
    font-variant-numeric: tabular-nums;
  }
  .field-grid input:focus-visible, .field-grid select:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 1px;
  }

  .primary-btn {
    width: 100%;
    background: var(--navy); color: var(--navy-ink);
    border: none; border-radius: 12px; padding: 13px;
    font-family: inherit; font-weight: 600; font-size: 15px;
    cursor: pointer;
  }
  .primary-btn:disabled { opacity: 0.55; cursor: default; }
  .primary-btn:not(:disabled):hover { opacity: 0.9; }

  .error-banner {
    background: var(--red-soft); border: 1px solid var(--red); color: var(--ink);
    border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-top: 10px;
  }

  /* ---------- Result card ---------- */
  .score-hero { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .score-hero .value {
    font-family: 'Source Serif 4', serif; font-size: 40px; font-weight: 600;
    letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
  }
  .score-hero .range { color: var(--slate); font-size: 13px; }
  .score-bar-track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-bottom: 3px; }
  .score-bar-fill { height: 100%; border-radius: 4px; background: var(--navy); }
  .score-scale { display: flex; justify-content: space-between; color: var(--slate); font-size: 10.5px; margin-bottom: 12px; }

  .status-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 600;
    margin-bottom: 12px; margin-right: 6px;
  }
  .status-chip.good { color: var(--green); background: var(--green-soft); border: 1px solid var(--green); }
  .status-chip.bad { color: var(--red); background: var(--red-soft); border: 1px solid var(--red); }
  .status-chip.warn { color: var(--amber); background: var(--amber-soft); border: 1px solid var(--amber); }

  .repay-line { font-size: 13px; color: var(--ink-soft); margin: 0 0 4px; }
  .repay-line b { font-variant-numeric: tabular-nums; }

  .factors-heading {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--slate); font-weight: 600; margin: 16px 0 4px;
  }
  .factor-row { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--surface-sunken); }
  .factor-row:first-of-type { border-top: none; }
  .factor-row .sign {
    font-weight: 700; width: 18px; flex-shrink: 0; text-align: center;
    font-variant-numeric: tabular-nums; font-size: 15px; padding-top: 1px;
  }
  .factor-row .sign.pos { color: var(--green); }
  .factor-row .sign.neg { color: var(--red); }
  .factor-row .f-body p { margin: 0 0 3px; font-size: 13.5px; }
  .factor-row .f-body .f-action { color: var(--slate); font-size: 12px; }

  .result-meta {
    display: flex; gap: 14px; flex-wrap: wrap;
    color: var(--slate); font-size: 11px; margin-top: 14px;
    padding-top: 10px; border-top: 1px dashed var(--line);
  }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand .badge {
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--navy); color: var(--navy-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 16px;
    flex-shrink: 0;
  }
  .brand .names { min-width: 0; }
  .brand .mark {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: -0.01em;
    display: block;
  }
  .brand .status-line {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--slate);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--slate); flex-shrink: 0;
    transition: background 0.3s;
  }
  .dot.ok { background: var(--green); }
  .dot.bad { background: var(--red); }
  .dot.pending { background: var(--amber); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @media (prefers-reduced-motion: reduce) { .dot.pending { animation: none; } }

  /* ---------- Language switcher ---------- */
  .lang-switch {
    display: flex;
    background: var(--surface-sunken);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    flex-shrink: 0;
  }
  .lang-btn {
    border: none;
    background: transparent;
    color: var(--slate);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 11px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .lang-btn.active { background: var(--navy); color: var(--navy-ink); }
  .lang-btn:disabled { color: var(--line); cursor: not-allowed; position: relative; }
  .lang-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .soon-badge {
    font-size: 8.5px;
    vertical-align: super;
    margin-left: 1px;
  }

  /* ---------- Thread ---------- */
  .chat-section { display: flex; flex-direction: column; }
  .thread {
    max-height: 46vh;
    min-height: 90px;
    overflow-y: auto;
    padding: 4px 2px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .turn { display: flex; flex-direction: column; gap: 5px; max-width: 88%; }
  .turn.user { align-self: flex-end; align-items: flex-end; }
  .turn.assistant { align-self: flex-start; }

  .bubble {
    padding: 12px 15px;
    border-radius: 4px;
    font-size: 15.5px;
    line-height: 1.55;
  }
  .turn.user .bubble {
    background: var(--navy);
    color: var(--navy-ink);
    border-radius: 14px 14px 3px 14px;
  }
  .turn.assistant .bubble {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px 14px 14px 14px;
    box-shadow: var(--shadow);
  }
  .turn.assistant .bubble.escalated {
    border-color: var(--amber);
    background: var(--amber-soft);
  }

  .cite-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .cite {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    background: var(--surface-sunken);
    border: 1px solid var(--line);
    padding: 3px 8px;
    border-radius: 4px;
  }
  .disclaimer {
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--slate);
    font-style: italic;
  }

  /* ---------- Inline "how I answered" toggle ---------- */
  .trace-toggle {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: var(--slate);
    font-family: inherit;
    font-size: 12px;
    padding: 2px 2px;
    margin-top: 2px;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-style: dotted;
    text-underline-offset: 3px;
  }
  .trace-toggle:hover { color: var(--ink); }
  .trace-toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .trace-toggle .chev { transition: transform 0.15s; display: inline-block; }
  .trace-toggle.open .chev { transform: rotate(90deg); }

  .trace-card {
    display: none;
    background: var(--surface-sunken);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 12.5px;
    width: 100%;
  }
  .trace-card.open { display: block; }
  .trace-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .trace-row:last-child { margin-bottom: 0; }
  .trace-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--slate); font-weight: 600; width: 92px; flex-shrink: 0;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px; font-weight: 500;
    padding: 3px 9px; border-radius: 6px;
  }
  .pill.route-policy { background: var(--gold-soft); color: var(--gold); }
  .pill.route-credit_assessment { background: var(--green-soft); color: var(--green); }
  .pill.route-off_topic { background: var(--red-soft); color: var(--red); }
  .pill.status-yes { background: var(--green-soft); color: var(--green); }
  .pill.status-no { background: var(--amber-soft); color: var(--amber); }
  .mini-meter {
    flex: 1; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden;
  }
  .mini-meter-fill { height: 100%; background: var(--green); border-radius: 999px; }
  .mini-meter-fill.low { background: var(--amber); }
  .num { font-variant-numeric: tabular-nums; }

  .thinking { display: flex; gap: 5px; padding: 6px 2px; }
  .thinking span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--slate);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-4px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .thinking span { animation: none; } }

  /* ---------- Composer ---------- */
  .composer-area {
    border-top: 1px solid var(--line);
    padding-top: 12px;
    margin-top: 4px;
  }
  .hint {
    font-size: 12px;
    color: var(--slate);
    margin: 0 0 8px;
  }
  .chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .chip {
    font-size: 13px;
    font-family: inherit;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 8px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .chip:hover { border-color: var(--gold); color: var(--ink); }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .composer { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 14px;
    padding: 12px 15px;
    font-family: inherit;
    font-size: 15.5px;
    line-height: 1.4;
    max-height: 120px;
  }
  .composer textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .send-btn {
    background: var(--navy);
    color: var(--navy-ink);
    border: none;
    border-radius: 14px;
    padding: 12px 20px;
    font-family: inherit;
    font-weight: 500;
    font-size: 14.5px;
    cursor: pointer;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .send-btn:disabled { opacity: 0.5; cursor: default; }
  .send-btn:not(:disabled):hover { opacity: 0.88; }
  .send-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>

<div class="app">
  <header>
    <div class="brand">
      <span class="badge">F</span>
      <div class="names">
        <span class="mark" id="brandName">FinBuddy</span>
        <span class="status-line">
          <span class="dot pending" id="statusDot"></span>
          <span id="statusText">&hellip;</span>
        </span>
      </div>
    </div>
    <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
      <button class="lang-btn active" data-lang="en">English</button>
      <button class="lang-btn" data-lang="hi">हिन्दी</button>
      <button class="lang-btn" data-lang="kn" disabled title="Coming soon">ಕನ್ನಡ<span class="soon-badge">SOON</span></button>
    </div>
  </header>

  <main>
    <section class="section-card" id="creditCard">
      <h2 id="creditHeading"></h2>
      <p class="section-hint" id="creditHint"></p>

      <div class="persona-row" id="personaRow"></div>

      <button class="fields-toggle" id="fieldsToggle" type="button"></button>
      <div class="field-grid" id="fieldGrid"></div>

      <button class="primary-btn" id="scoreBtn"></button>
      <div class="error-banner" id="creditError" style="display:none;"></div>
    </section>

    <section class="section-card" id="resultCard" style="display:none;"></section>

    <section class="section-card chat-section">
      <h2 id="chatHeading"></h2>
      <p class="section-hint" id="chatHint"></p>
      <div class="thread" id="thread"></div>

      <div class="composer-area">
        <p class="hint" id="hintText" style="display:none;"></p>
        <div class="chips" id="chips"></div>
        <div class="composer">
          <textarea id="input" rows="1" aria-label="Message"></textarea>
          <button class="send-btn" id="sendBtn"></button>
        </div>
      </div>
    </section>
  </main>
</div>

        rajesh: { name: 'Rajesh', sub: 'Delivery rider · Bengaluru' },
        meena: { name: 'Meena', sub: 'Kirana shop owner · Chennai' },
        custom: { name: 'Custom', sub: 'Your own numbers' },
      },
    },
    hi: {
      brand: 'फिनबडी',
      statusChecking: 'देख रही हूं…',
      statusLive: 'मदद के लिए तैयार',
      statusDown: 'कनेक्ट नहीं हो पा रहा',
      greeting: 'नमस्ते, मैं FinBuddy हूं। अपने डेटा, लोन या FinBuddy के काम करने के तरीके के बारे में मुझसे कुछ भी पूछें। मैं सिर्फ असली RBI और सरकारी नियमों के आधार पर जवाब देती हूं — अगर मुझे पक्का पता नहीं है, तो मैं अंदाज़ा नहीं लगाऊंगी, साफ़ बता दूंगी।',
      placeholder: 'अपना सवाल लिखें…',
      send: 'भेजें',
      hintOtherLang: 'सबसे सही जवाब के लिए सवाल अंग्रेज़ी में बेहतर काम करता है — मैं फिर भी आपकी चुनी हुई भाषा में जवाब दूंगी।',
      traceShow: 'यह जवाब कैसे मिला?',
      traceHide: 'बंद करें',
      traceRoute: 'तरह',
      traceGrounding: 'आधार',
      traceSources: 'स्रोत',
      traceStatus: 'नतीजा',
      traceConfidence: 'भरोसा',
      routeLabels: { policy: 'नियम संबंधी सवाल', credit_assessment: 'क्रेडिट जांच', off_topic: 'मदद नहीं कर पाई' },
      groundedYes: 'सही नियम मिले',
      groundedNo: 'सही जानकारी नहीं मिली',
      resultAnswered: 'सीधे जवाब दिया',
      resultEscalated: 'इंसान कोच के पास भेजा',
      chips: [
        { label: 'आपको मेरा डेटा क्यों चाहिए?', query: 'What counts as valid consent for using my personal data?' },
        { label: 'गारंटर कितना कवर कर सकता है?', query: 'What is the cap on Default Loss Guarantee cover for a loan?' },
        { label: 'कुछ भी पूछें', query: "What's a good recipe for butter chicken?" },
      ],
      errHttp: (code) => `मेरी तरफ़ से कुछ गड़बड़ हो गई (एरर ${code})। अगर ऐप अभी जगी है, तो कुछ सेकंड में फिर कोशिश करें।`,
      errNetwork: 'मैं कनेक्ट नहीं हो पाई। ऐप सो कर उठ रही हो सकती है — पहली बार में करीब एक मिनट लग सकता है। कृपया फिर कोशिश करें।',
      creditHeading: 'क्रेडिट आकलन करवाएं',
      creditHint: 'अपने जैसा कोई चुनें, या अपने नंबर डालें। यह FinBuddy के असली, पहले से स्वीकृत स्कोरिंग सिस्टम को कॉल करता है — डेमो नकली नहीं।',
      chatHeading: 'FinBuddy से सवाल पूछें',
      chatHint: 'FinBuddy के असली RBI/DPDP नीति दस्तावेज़ों पर आधारित — अगर पता नहीं है, तो अंदाज़ा लगाने के बजाय साफ़ बता देती है।',
      fieldsShow: 'नंबर खुद बदलें',
      fieldsHide: 'नंबर छुपाएं',
      scoreBtn: 'मेरा स्कोर देखें',
      scoreBtnLoading: 'देख रही हूं…',
      fields: {
        avg_monthly_income: 'औसत मासिक आय (₹)',
        income_regularity_score: 'आय की नियमितता (0–1)',
        tx_count_30d: 'UPI लेनदेन / 30 दिन',
        merchant_diversity: 'अलग-अलग दुकानों को भुगतान',
        balance_dip_frequency: 'बैलेंस कम होने की बार',
        b2b_ratio: 'व्यवसायों को भुगतान का हिस्सा (0–1)',
        avg_transaction_size: 'औसत भुगतान राशि (₹)',
        tenure_months: 'UPI इतिहास (महीने)',
        geography: 'इलाके का प्रकार',
      },
      geographyOptions: { urban: 'शहरी', semi_urban: 'अर्ध-शहरी', rural: 'ग्रामीण' },
      creditErr: (msg) => `स्कोर नहीं मिल पाया: ${msg}`,
      resultHeading: 'आपका आकलन',
      approved: 'स्वीकृत',
      notApproved: 'अभी स्वीकृत नहीं',
      anomalyWarn: 'असामान्य UPI पैटर्न मिला',
      repayLine: (pct) => `समय पर चुकाने की संभावना: ${pct}%`,
      factorsHeading: 'यह नतीजा क्यों',
      metaLatency: (ms) => `${ms}ms में स्कोर मिला`,
      metaFair: 'निष्पक्षता-जांचा गया निर्णय',
      metaPlain: 'सामान्य सीमा (इलाका नहीं दिया गया)',
      metaBand: (band) => `आय श्रेणी: ${band}`,
      personas: {
        rajesh: { name: 'राजेश', sub: 'डिलीवरी राइडर · बेंगलुरु' },
        meena: { name: 'मीना', sub: 'किराना दुकान मालिक · चेन्नई' },
        custom: { name: 'कस्टम', sub: 'अपने नंबर डालें' },
      },
    },
  };

  // Real UPI-signal presets matching production FinBuddy's own scoring API
  // contract (avg_monthly_income..tenure_months + geography) -- same shape
  // as customer_ui/PRESETS in the production repo, reused here read-only
  // (values only, no code copied) since this project never modifies that
  // repo. Sent through THIS project's own /agent/run (credit_signals), not
  // the scoring API directly -- that's what actually demonstrates the
  // agentic orchestration (Intent Router, guardrails, disclaimer) instead
  // of just duplicating the production customer UI's direct-call pattern.
  const PERSONAS = {
    rajesh: {
      emoji: '🛺',
      avg_monthly_income: 20000, income_regularity_score: 0.82, tx_count_30d: 400,
      merchant_diversity: 12, balance_dip_frequency: 2, b2b_ratio: 0.15,
      avg_transaction_size: 50, tenure_months: 6, geography: 'urban',
    },
    meena: {
      emoji: '🛒',
      avg_monthly_income: 37000, income_regularity_score: 0.91, tx_count_30d: 900,
      merchant_diversity: 28, balance_dip_frequency: 0, b2b_ratio: 0.65,
      avg_transaction_size: 210, tenure_months: 12, geography: 'urban',
    },
    custom: {
      emoji: '✏️',
      avg_monthly_income: 15000, income_regularity_score: 0.5, tx_count_30d: 100,
      merchant_diversity: 8, balance_dip_frequency: 3, b2b_ratio: 0.1,
      avg_transaction_size: 150, tenure_months: 3, geography: 'semi_urban',
    },
  };
  const FIELD_ORDER = [
    'avg_monthly_income', 'income_regularity_score', 'tx_count_30d', 'merchant_diversity',
    'balance_dip_frequency', 'b2b_ratio', 'avg_transaction_size', 'tenure_months',
  ];
  const NUM_STEP = {
    income_regularity_score: '0.01', b2b_ratio: '0.01',
  };

  let currentLang = 'en';
  const S = () => STRINGS[currentLang];
  let selectedPersona = 'rajesh';
  let formValues = { ...PERSONAS.rajesh };

  const thread = document.getElementById('thread');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const brandName = document.getElementById('brandName');
  const hintText = document.getElementById('hintText');
  const chipsEl = document.getElementById('chips');
  const langSwitch = document.getElementById('langSwitch');
  const creditHeading = document.getElementById('creditHeading');
  const creditHint = document.getElementById('creditHint');
  const chatHeading = document.getElementById('chatHeading');
  const chatHint = document.getElementById('chatHint');
  const personaRow = document.getElementById('personaRow');
  const fieldsToggle = document.getElementById('fieldsToggle');
  const fieldGrid = document.getElementById('fieldGrid');
  const scoreBtn = document.getElementById('scoreBtn');
  const creditError = document.getElementById('creditError');
  const resultCard = document.getElementById('resultCard');

  let sessionId = null;
  try { sessionId = crypto.randomUUID(); } catch (e) { sessionId = 'sess-' + Math.random().toString(36).slice(2); }
  let isLive = false;

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function applyStrings() {
    const s = S();
    brandName.textContent = s.brand;
    statusText.textContent = isLive ? s.statusLive : (statusDot.classList.contains('bad') ? s.statusDown : s.statusChecking);
    input.placeholder = s.placeholder;
    sendBtn.textContent = s.send;
    if (currentLang === 'en') {
      hintText.style.display = 'none';
    } else {
      hintText.style.display = 'block';
      hintText.textContent = s.hintOtherLang;
    }
    chipsEl.innerHTML = s.chips.map((c, i) =>
      `<button class="chip" data-idx="${i}">${escapeHtml(c.label)}</button>`
    ).join('');

    creditHeading.textContent = s.creditHeading;
    creditHint.textContent = s.creditHint;
    chatHeading.textContent = s.chatHeading;
    chatHint.textContent = s.chatHint;
    scoreBtn.textContent = scoreBtn.disabled && scoreBtn.dataset.loading ? s.scoreBtnLoading : s.scoreBtn;
    renderPersonaRow();
    renderFieldGrid();
    updateFieldsToggleLabel();
  }

  function renderPersonaRow() {
    const s = S();
    personaRow.innerHTML = Object.keys(PERSONAS).map((key) => {
      const p = PERSONAS[key];
      const label = s.personas[key];
      return `<button class="persona-card${key === selectedPersona ? ' active' : ''}" data-persona="${key}" type="button">
        <span class="emoji">${p.emoji}</span>
        <span class="p-name">${escapeHtml(label.name)}</span>
        <span class="p-sub">${escapeHtml(label.sub)}</span>
      </button>`;
    }).join('');
  }

  function updateFieldsToggleLabel() {
    const s = S();
    const open = fieldGrid.classList.contains('open');
    fieldsToggle.textContent = open ? s.fieldsHide : s.fieldsShow;
  }

  function renderFieldGrid() {
    const s = S();
    const rows = FIELD_ORDER.map((key) => `
      <div class="field">
        <label>${escapeHtml(s.fields[key])}</label>
        <input type="number" data-field="${key}" value="${formValues[key]}" step="${NUM_STEP[key] || '1'}" min="0">
      </div>
    `).join('');
    const geoOptions = Object.keys(s.geographyOptions).map((k) =>
      `<option value="${k}" ${formValues.geography === k ? 'selected' : ''}>${escapeHtml(s.geographyOptions[k])}</option>`
    ).join('');
    fieldGrid.innerHTML = rows + `
      <div class="field field-full">
        <label>${escapeHtml(s.fields.geography)}</label>
        <select data-field="geography">${geoOptions}</select>
      </div>`;
  }

  personaRow.addEventListener('click', (e) => {
    const btn = e.target.closest('.persona-card');
    if (!btn) return;
    selectedPersona = btn.dataset.persona;
    formValues = { ...PERSONAS[selectedPersona] };
    renderPersonaRow();
    renderFieldGrid();
    if (selectedPersona === 'custom' && !fieldGrid.classList.contains('open')) {
      fieldGrid.classList.add('open');
      updateFieldsToggleLabel();
    }
  });

  fieldsToggle.addEventListener('click', () => {
    fieldGrid.classList.toggle('open');
    updateFieldsToggleLabel();
  });

  fieldGrid.addEventListener('input', (e) => {
    const el = e.target.closest('[data-field]');
    if (!el) return;
    formValues[el.dataset.field] = el.tagName === 'SELECT' ? el.value : Number(el.value);
  });

  function renderResultCard(data) {
    const s = S();
    const c = data.credit_assessment;
    if (!c) { resultCard.style.display = 'none'; return; }
    const pct = Math.max(0, Math.min(100, ((c.credit_score - 300) / (850 - 300)) * 100));
    const repayPct = Math.round(c.calibrated_probability_of_repayment * 100);

    let html = `<h2>${s.resultHeading}</h2>`;
    html += `<div class="score-hero"><span class="value">${c.credit_score}</span><span class="range">/ 850</span></div>`;
    html += `<div class="score-bar-track"><div class="score-bar-fill" style="width:${pct}%"></div></div>`;
    html += `<div class="score-scale"><span>300</span><span>850</span></div>`;
    html += `<span class="status-chip ${c.approved ? 'good' : 'bad'}">${c.approved ? '✓ ' + s.approved : '✕ ' + s.notApproved}</span>`;
    if (c.is_anomalous) {
      html += `<span class="status-chip warn">⚠ ${s.anomalyWarn}</span>`;
    }
    html += `<p class="repay-line">${s.repayLine(repayPct)}</p>`;
    html += `<div class="factors-heading">${s.factorsHeading}</div>`;
    c.top_3_factors.forEach((f) => {
      const pos = f.direction === 'positive';
      html += `<div class="factor-row">
        <span class="sign ${pos ? 'pos' : 'neg'}">${pos ? '+' : '−'}</span>
        <div class="f-body"><p>${escapeHtml(f.plain_english)}</p><p class="f-action">${escapeHtml(f.action)}</p></div>
      </div>`;
    });
    html += `<div class="result-meta">
      <span>${s.metaLatency(Math.round(c.latency_ms))}</span>
      <span>${c.fairness_mitigation_applied ? s.metaFair : s.metaPlain}</span>
      <span>${s.metaBand(c.income_band)}</span>
    </div>`;

    resultCard.innerHTML = html;
    resultCard.style.display = 'block';
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function runCreditAssessment() {
    creditError.style.display = 'none';
    scoreBtn.disabled = true;
    scoreBtn.dataset.loading = '1';
    scoreBtn.textContent = S().scoreBtnLoading;
    try {
      const res = await fetch(API_BASE + '/agent/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query: 'Can I get a loan?',
          session_id: sessionId,
          response_language: currentLang,
          credit_signals: { ...formValues },
        }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.credit_assessment) throw new Error(data.answer || 'no assessment returned');
      renderResultCard(data);
    } catch (e) {
      creditError.textContent = S().creditErr(e.message);
      creditError.style.display = 'block';
    } finally {
      scoreBtn.disabled = false;
      delete scoreBtn.dataset.loading;
      scoreBtn.textContent = S().scoreBtn;
    }
  }

  scoreBtn.addEventListener('click', runCreditAssessment);

  function renderGreeting() {
    thread.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'turn assistant';
    el.innerHTML = `<div class="bubble">${escapeHtml(S().greeting)}</div>`;
    thread.appendChild(el);
  }

  async function checkHealth() {
    try {
      const r = await fetch(API_BASE + '/health', { method: 'GET' });
      isLive = r.ok;
      statusDot.className = 'dot ' + (r.ok ? 'ok' : 'bad');
    } catch (e) {
      isLive = false;
      statusDot.className = 'dot bad';
    }
    applyStrings();
  }
  checkHealth();

  function addUserTurn(text) {
    const el = document.createElement('div');
    el.className = 'turn user';
    el.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    thread.appendChild(el);
    thread.scrollTop = thread.scrollHeight;
  }

  function addThinkingTurn() {
    const el = document.createElement('div');
    el.className = 'turn assistant';
    el.innerHTML = `<div class="bubble"><div class="thinking"><span></span><span></span><span></span></div></div>`;
    thread.appendChild(el);
    thread.scrollTop = thread.scrollHeight;
    return el;
  }

  let traceSeq = 0;

  function routeLabel(route) {
    const s = S();
    return (route && s.routeLabels[route]) || '—';
  }

  function buildTraceCard(data) {
    const s = S();
    const routeClass = data.route ? `route-${data.route}` : '';
    const hasScore = typeof data.top_score === 'number';
    const scorePct = hasScore ? Math.max(0, Math.min(1, data.top_score)) * 100 : 0;

    let rows = '';
    rows += `<div class="trace-row">
      <span class="trace-label">${s.traceRoute}</span>
      <span class="pill ${routeClass}">${routeLabel(data.route)}</span>
    </div>`;

    if (hasScore) {
      rows += `<div class="trace-row">
        <span class="trace-label">${s.traceGrounding}</span>
        <div class="mini-meter"><div class="mini-meter-fill ${data.sufficient ? '' : 'low'}" style="width:${scorePct}%"></div></div>
        <span class="pill status-${data.sufficient ? 'yes' : 'no'}">${data.sufficient ? s.groundedYes : s.groundedNo}</span>
      </div>`;
    }

    if (data.sources && data.sources.length) {
      rows += `<div class="trace-row">
        <span class="trace-label">${s.traceSources}</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;">${data.sources.map(escapeHtml).join(', ')}</span>
      </div>`;
    }

    rows += `<div class="trace-row">
      <span class="trace-label">${s.traceStatus}</span>
      <span class="pill status-${data.escalate_to_human ? 'no' : 'yes'}">${data.escalate_to_human ? s.resultEscalated : s.resultAnswered}</span>
    </div>`;

    rows += `<div class="trace-row">
      <span class="trace-label">${s.traceConfidence}</span>
      <span class="num">${(data.confidence * 100).toFixed(0)}%</span>
    </div>`;

    return rows;
  }

  function addAssistantTurn(data) {
    const el = document.createElement('div');
    el.className = 'turn assistant';
    const cites = (data.sources || []).map(x => `<span class="cite">${escapeHtml(x)}</span>`).join('');
    const disclaimer = data.disclaimer ? `<div class="disclaimer">${escapeHtml(data.disclaimer)}</div>` : '';
    const traceId = 'trace-' + (traceSeq++);
    el.innerHTML = `
      <div class="bubble${data.escalate_to_human ? ' escalated' : ''}">
        ${escapeHtml(data.answer)}
        ${cites ? `<div class="cite-row">${cites}</div>` : ''}
        ${disclaimer}
      </div>
      <button class="trace-toggle" data-target="${traceId}" type="button">
        <span class="chev">›</span><span class="toggle-label">${S().traceShow}</span>
      </button>
      <div class="trace-card" id="${traceId}">${buildTraceCard(data)}</div>
    `;
    thread.appendChild(el);
    thread.scrollTop = thread.scrollHeight;
  }

  function addErrorTurn(message) {
    const el = document.createElement('div');
    el.className = 'turn assistant';
    el.innerHTML = `<div class="bubble escalated">${escapeHtml(message)}</div>`;
    thread.appendChild(el);
    thread.scrollTop = thread.scrollHeight;
  }

  thread.addEventListener('click', (e) => {
    const btn = e.target.closest('.trace-toggle');
    if (!btn) return;
    const card = document.getElementById(btn.dataset.target);
    const isOpen = card.classList.toggle('open');
    btn.classList.toggle('open', isOpen);
    btn.querySelector('.toggle-label').textContent = isOpen ? S().traceHide : S().traceShow;
  });

  async function sendMessage(queryText, displayText) {
    if (!queryText.trim()) return;
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    addUserTurn(displayText || queryText);
    const thinkingEl = addThinkingTurn();

    try {
      const res = await fetch(API_BASE + '/agent/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: queryText, session_id: sessionId, response_language: currentLang }),
      });
      thinkingEl.remove();
      if (!res.ok) {
        addErrorTurn(S().errHttp(res.status));
        return;
      }
      const data = await res.json();
      addAssistantTurn(data);
      isLive = true;
      statusDot.className = 'dot ok';
      statusText.textContent = S().statusLive;
    } catch (e) {
      thinkingEl.remove();
      addErrorTurn(S().errNetwork);
      isLive = false;
      statusDot.className = 'dot bad';
      statusText.textContent = S().statusDown;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(input.value));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(input.value);
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  chipsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    const chip = S().chips[Number(btn.dataset.idx)];
    // Send the verified English query for reliable retrieval, but show the
    // user the label in their chosen language -- otherwise a Hindi speaker
    // tapping a Hindi-labeled chip would see their own message echo back in
    // English, which reads as if the app ignored what they tapped.
    sendMessage(chip.query, chip.label);
  });

  langSwitch.addEventListener('click', (e) => {
    const btn = e.target.closest('.lang-btn');
    if (!btn || btn.disabled) return;
    currentLang = btn.dataset.lang;
    langSwitch.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b === btn));
    applyStrings();
    renderGreeting();
  });

  applyStrings();
  renderGreeting();
</script>
